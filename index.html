<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Coldwater Church Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #1B2A4A;
      --gold: #C9A84C;
      --gold-light: #F0DFA0;
      --cream: #FDFAF4;
      --white: #FFFFFF;
      --gray-100: #F3F4F6;
      --gray-300: #D1D5DB;
      --gray-500: #6B7280;
      --gray-700: #374151;
      --green: #166534;
      --green-bg: #DCFCE7;
      --red: #991B1B;
      --red-bg: #FEE2E2;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--gray-700);
      min-height: 100vh;
    }

    header {
      background: var(--navy);
      color: var(--white);
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
      color: var(--white);
    }

    header p {
      font-size: 0.8rem;
      color: var(--gold-light);
      margin-top: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--navy);
    }

    select, input[type="date"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--gray-300);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: var(--gray-700);
      background: var(--white);
      appearance: none;
      -webkit-appearance: none;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--navy);
    }

    .field + .field { margin-top: 14px; }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .search-wrap input { padding-left: 36px; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
      font-size: 1rem;
      pointer-events: none;
    }

    /* Member row */
    .member-row {
      margin-bottom: 8px;
    }

    .attendance-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-300);
      background: var(--white);
      transition: all 0.2s;
    }

    .attendance-bar.present {
      border-color: #86EFAC;
      background: var(--green-bg);
    }

    .attendance-bar.absent {
      border-color: #FCA5A5;
      background: var(--red-bg);
    }

    .member-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--navy);
      flex: 1;
    }

    /* Toggle Switch */
    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch-label {
      font-size: 0.75rem;
      font-weight: 600;
      min-width: 44px;
      text-align: right;
    }

    .switch-label.present { color: var(--green); }
    .switch-label.absent { color: var(--red); }

    .switch {
      position: relative;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--green);
      border-radius: 26px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    /* Checked = absent (toggled right) */
    input:checked + .slider {
      background: var(--red);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Reason dropdown */
    .reason-wrap {
      padding: 6px 14px 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .reason-wrap select {
      font-size: 0.83rem;
      padding: 6px 10px;
      flex: 1;
    }

    .reason-wrap input[type="text"] {
      font-size: 0.83rem;
      padding: 6px 10px;
      flex: 1;
    }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat-pill {
      flex: 1;
      text-align: center;
      background: var(--gray-100);
      border-radius: 8px;
      padding: 8px 4px;
    }

    .stat-pill .num {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--navy);
    }

    .stat-pill .lbl {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--gray-500);
    }

    .stat-pill.present-pill .num { color: var(--green); }
    .stat-pill.absent-pill .num { color: var(--red); }

    /* Mark all buttons */
    .mark-all-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mark-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-300);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--white);
      color: var(--gray-500);
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }

    .mark-btn:hover { border-color: var(--navy); color: var(--navy); }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 12px;
    }
    .section-divider span {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gray-500);
      white-space: nowrap;
    }
    .section-divider::before, .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-300);
    }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      border-bottom: 3px solid var(--gold);
    }

    .submit-btn:hover { background: #253a63; }
    .submit-btn:disabled { background: var(--gray-300); border-bottom-color: transparent; cursor: not-allowed; }

    /* Messages */
    .msg {
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      margin-top: 12px;
      display: none;
    }
    .msg.success { background: var(--green-bg); color: var(--green); display: block; }
    .msg.error { background: var(--red-bg); color: var(--red); display: block; }

    .loading {
      text-align: center;
      color: var(--gray-500);
      font-size: 0.9rem;
      padding: 30px 0;
    }

    /* Absence summary */
    .summary-box {
      background: #FFF8E7;
      border: 1.5px solid var(--gold);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 12px;
      display: none;
    }

    .summary-box h3 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .summary-group { margin-bottom: 10px; }
    .summary-group .group-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gray-500);
      margin-bottom: 4px;
    }
    .summary-group .names {
      font-size: 0.88rem;
      color: var(--navy);
      line-height: 1.6;
    }

    .copy-btn {
      margin-top: 10px;
      padding: 8px 16px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .copy-btn:hover { background: #253a63; }
  </style>
</head>
<body>

<header>
  <h1>Coldwater Church of Christ</h1>
  <p>Attendance Tracker</p>
</header>

<div class="container">

  <!-- Service Info -->
  <div class="card">
    <div class="card-title">Service Details</div>

    <div class="field">
      <label for="serviceType">Service</label>
      <select id="serviceType">
        <option value="">— Select service —</option>
        <option value="Sunday AM">Sunday AM</option>
        <option value="Sunday PM">Sunday PM</option>
        <option value="Wednesday PM">Wednesday PM</option>
      </select>
    </div>

    <div class="field">
      <label for="serviceDate">Date</label>
      <input type="date" id="serviceDate" />
    </div>

    <div class="field">
      <label for="submittedBy">Your Name <span style="color:var(--gray-500);font-weight:400">(optional)</span></label>
      <input type="text" id="submittedBy" placeholder="Who is taking attendance?" />
    </div>
  </div>

  <!-- Members -->
  <div class="card">
    <div class="card-title">Member Attendance</div>

    <div class="stats">
      <div class="stat-pill">
        <div class="num" id="totalCount">—</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat-pill present-pill">
        <div class="num" id="presentCount">0</div>
        <div class="lbl">Present</div>
      </div>
      <div class="stat-pill absent-pill">
        <div class="num" id="absentCount">0</div>
        <div class="lbl">Absent</div>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search members…" oninput="filterMembers()" />
    </div>

    <div class="section-divider"><span>Mark All</span></div>
    <div class="mark-all-wrap">
      <button class="mark-btn" onclick="markAll('Present')">✓ All Present</button>
      <button class="mark-btn" onclick="markAll('Absent')">✗ All Absent</button>
    </div>

    <div id="memberList">
      <div class="loading">Loading members…</div>
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitAttendance()">Submit Attendance</button>
  <div class="msg" id="statusMsg"></div>

  <!-- Absence Summary -->
  <div class="summary-box" id="summaryBox">
    <h3>📋 Absence Summary</h3>
    <div id="summaryContent"></div>
    <button class="copy-btn" onclick="copySummary()">Copy to Clipboard</button>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM3kgoHlXKEb2x3JbvL7VOBnklWXnQ0GrZ9eVLrFMv7eXE1nzdDi-Jy8zurzT5nDJa/exec";

  let members = [];
  let attendance = {};

  document.getElementById('serviceDate').value = new Date().toISOString().split('T')[0];

  function loadMembers() {
    window._membersCallback = function(data) {
      members = data.map(m => m.firstName + ' ' + m.lastName);
      members.forEach(name => { attendance[name] = { status: 'Present', reason: '' }; });
      document.getElementById('totalCount').textContent = members.length;
      renderMembers(members);
      delete window._membersCallback;
      var s = document.getElementById('jsonpScript');
      if (s) s.remove();
    };

    var script = document.createElement('script');
    script.id = 'jsonpScript';
    script.src = SCRIPT_URL + '?callback=_membersCallback';
    script.onerror = function() {
      document.getElementById('memberList').innerHTML = '<div class="loading" style="color:#991B1B">Failed to load members. Check your connection.</div>';
    };
    document.body.appendChild(script);

    setTimeout(function() {
      if (members.length === 0) {
        document.getElementById('memberList').innerHTML = '<div class="loading" style="color:#991B1B">Failed to load members — request timed out. Please refresh.</div>';
      }
    }, 8000);
  }

  function renderMembers(list) {
    var container = document.getElementById('memberList');
    if (list.length === 0) {
      container.innerHTML = '<div class="loading">No members found.</div>';
      return;
    }

    var html = '';
    list.forEach(function(name) {
      var att = attendance[name];
      var isAbsent = att.status === 'Absent';
      var barClass = isAbsent ? 'absent' : 'present';
      var labelClass = isAbsent ? 'absent' : 'present';
      var labelText = isAbsent ? 'Absent' : 'Present';
      var safeId = name.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '');

      var reasonHtml = '';
      if (isAbsent) {
        var isOther = att.reason && ['Travel','Illness','Work','Unknown',''].indexOf(att.reason) === -1;
        var selVal = isOther ? 'Other' : att.reason;
        reasonHtml = '<div class="reason-wrap">' +
          '<select onchange="setReason(\'' + name + '\', this.value)">' +
          '<option value="" ' + (selVal===''?'selected':'') + '>— Reason (optional) —</option>' +
          '<option value="Travel" ' + (selVal==='Travel'?'selected':'') + '>Travel</option>' +
          '<option value="Illness" ' + (selVal==='Illness'?'selected':'') + '>Illness</option>' +
          '<option value="Work" ' + (selVal==='Work'?'selected':'') + '>Work</option>' +
          '<option value="Unknown" ' + (selVal==='Unknown'?'selected':'') + '>Unknown</option>' +
          '<option value="Other" ' + (selVal==='Other'?'selected':'') + '>Other</option>' +
          '</select>' +
          (isOther ? '<input type="text" placeholder="Enter reason…" value="' + att.reason + '" oninput="setCustomReason(\'' + name + '\', this.value)" />' : '') +
          '</div>';
      }

      html += '<div class="member-row">' +
        '<div class="attendance-bar ' + barClass + '">' +
        '<span class="member-name">' + name + '</span>' +
        '<div class="switch-wrap">' +
        '<span class="switch-label ' + labelClass + '">' + labelText + '</span>' +
        '<label class="switch">' +
        '<input type="checkbox" ' + (isAbsent ? 'checked' : '') + ' onchange="toggleStatus(\'' + name + '\', this.checked)" />' +
        '<span class="slider"></span>' +
        '</label>' +
        '</div>' +
        '</div>' +
        reasonHtml +
        '</div>';
    });

    container.innerHTML = html;
    updateCounts();
  }

  function toggleStatus(name, isChecked) {
    attendance[name].status = isChecked ? 'Absent' : 'Present';
    if (!isChecked) attendance[name].reason = '';
    var search = document.getElementById('searchInput').value.toLowerCase();
    var filtered = members.filter(function(m) { return m.toLowerCase().indexOf(search) !== -1; });
    renderMembers(filtered);
  }

  function setReason(name, reason) {
    attendance[name].reason = reason;
    if (reason !== 'Other') {
      var search = document.getElementById('searchInput').value.toLowerCase();
      var filtered = members.filter(function(m) { return m.toLowerCase().indexOf(search) !== -1; });
      renderMembers(filtered);
    }
  }

  function setCustomReason(name, value) {
    attendance[name].reason = value;
  }

  function markAll(status) {
    members.forEach(function(name) {
      attendance[name] = { status: status, reason: '' };
    });
    var search = document.getElementById('searchInput').value.toLowerCase();
    var filtered = members.filter(function(m) { return m.toLowerCase().indexOf(search) !== -1; });
    renderMembers(filtered);
  }

  function filterMembers() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var filtered = members.filter(function(m) { return m.toLowerCase().indexOf(q) !== -1; });
    renderMembers(filtered);
  }

  function updateCounts() {
    var present = 0, absent = 0;
    Object.values(attendance).forEach(function(a) {
      if (a.status === 'Present') present++;
      else if (a.status === 'Absent') absent++;
    });
    document.getElementById('presentCount').textContent = present;
    document.getElementById('absentCount').textContent = absent;
  }

  async function submitAttendance() {
    var serviceType = document.getElementById('serviceType').value;
    var serviceDate = document.getElementById('serviceDate').value;
    var submittedBy = document.getElementById('submittedBy').value.trim();

    if (!serviceType) { showMsg('Please select a service type.', 'error'); return; }
    if (!serviceDate) { showMsg('Please select a date.', 'error'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    var attendees = members.map(function(name) {
      return { name: name, status: attendance[name].status, reason: attendance[name].reason || '' };
    });

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: serviceDate, serviceType: serviceType, submittedBy: submittedBy, attendees: attendees })
      });

      showMsg('✓ Attendance submitted successfully!', 'success');
      buildSummary(serviceDate, serviceType);
    } catch (err) {
      showMsg('Submission failed. Please try again.', 'error');
    }

    btn.textContent = 'Submit Attendance';
    btn.disabled = false;
  }

  function buildSummary(date, serviceType) {
    var absentees = [];
    Object.entries(attendance).forEach(function(entry) {
      if (entry[1].status === 'Absent') {
        absentees.push({ name: entry[0], reason: entry[1].reason || 'No reason given' });
      }
    });

    var summaryBox = document.getElementById('summaryBox');
    var summaryContent = document.getElementById('summaryContent');

    if (absentees.length === 0) {
      summaryBox.style.display = 'block';
      summaryContent.innerHTML = '<p style="color:var(--green);font-weight:600">🎉 No absences recorded!</p>';
      summaryBox.dataset.plain = '';
      return;
    }

    var groups = {};
    absentees.forEach(function(a) {
      var r = a.reason || 'No reason given';
      if (!groups[r]) groups[r] = [];
      groups[r].push(a.name);
    });

    var formattedDate = new Date(date + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

    var html = '';
    var plain = 'Absent – ' + formattedDate + ' (' + serviceType + ')\n\n';

    Object.entries(groups).forEach(function(entry) {
      var reason = entry[0], names = entry[1];
      html += '<div class="summary-group"><div class="group-label">' + reason + '</div><div class="names">' + names.join('; ') + '</div></div>';
      plain += reason + ': ' + names.join('; ') + '\n';
    });

    summaryBox.style.display = 'block';
    summaryContent.innerHTML = html;
    summaryBox.dataset.plain = plain.trim();
  }

  function copySummary() {
    var text = document.getElementById('summaryBox').dataset.plain;
    navigator.clipboard.writeText(text).then(function() {
      var btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy to Clipboard'; }, 2000);
    });
  }

  function showMsg(text, type) {
    var el = document.getElementById('statusMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(function() { el.className = 'msg'; }, 5000);
  }

  loadMembers();
</script>
</body>
</html>
